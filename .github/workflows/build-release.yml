name: Build iOS ipa + Android apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # EXPO_PUBLIC_* 는 번들 시점에 코드에 인라인된다. 러너에 없으면 앱이 시작하자마자
  # src/lib/config.ts의 required()에서 던진다. 저장소가 public이라 값은 Secrets에 둔다.
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
  EXPO_PUBLIC_INVITE_BASE_URL: ${{ secrets.EXPO_PUBLIC_INVITE_BASE_URL }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 빌드 번호를 커밋 수로 계산하므로 전체 이력이 필요하다

      - id: ver
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          # github.run_number를 쓰면 안 된다. 워크플로 파일 이름을 바꾸는 순간 1로 리셋되어
          # 예전 태그와 충돌하고, action-gh-release가 그 옛 릴리스에 파일을 덧붙인다.
          # (실제로 발생: 새 산출물이 7/25자 v1.0.0-build2 릴리스 안에 섞였다.)
          BUILD=$(git rev-list --count HEAD)
          TAG="v$VERSION-build$BUILD"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fail if the tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::태그 ${{ steps.ver.outputs.tag }} 가 이미 있다. 덮어쓰면 기존 릴리스가 오염된다."
            exit 1
          fi

      - name: Fail fast if EXPO_PUBLIC_* secrets are missing
        run: |
          missing=""
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY \
                   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID \
                   EXPO_PUBLIC_INVITE_BASE_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::누락된 GitHub Secrets:$missing"
            echo "빌드해도 앱이 시작 시 config.ts에서 던진다. 저장소 Settings > Secrets and variables > Actions 에 등록할 것."
            exit 1
          fi

  build-ios:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set iOS build number
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.ios.buildNumber='${{ needs.version.outputs.build }}';fs.writeFileSync('app.json',JSON.stringify(j,null,2));"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios

      - name: Build unsigned archive
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ios/build/app.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package ipa
        run: |
          mkdir -p ios/build/Payload
          cp -R ios/build/app.xcarchive/Products/Applications/*.app ios/build/Payload/
          cd ios/build
          zip -qry "ParksPJT1-${{ needs.version.outputs.tag }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/build/*.ipa

  # 안드로이드는 푸시할 때마다 돌리지 않는다. 사용자는 iOS 기기만 쓰고,
  # gradle 빌드가 iOS보다 오래 걸려 반복 개발을 느리게 만든다.
  # 필요할 때 Actions 탭에서 "Run workflow"로 수동 실행한다.
  build-android:
    needs: version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Set Android versionCode
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.android.versionCode=${{ needs.version.outputs.build }};fs.writeFileSync('app.json',JSON.stringify(j,null,2));"

      - name: Generate native Android project
        run: npx expo prebuild --platform android

      - name: Build release apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$SRC" "ParksPJT1-${{ needs.version.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ParksPJT1-*.apk

  release:
    needs: [version, build-ios, build-android]
    # build-android가 skipped여도 릴리스는 진행한다. iOS 실패는 릴리스하지 않는다.
    if: always() && needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: v${{ needs.version.outputs.version }} (build ${{ needs.version.outputs.build }})
          body: |
            **iOS** — unsigned ipa. SideStore/AltStore로 설치하세요.
            **Android** — apk는 수동 실행(Run workflow) 때만 포함됩니다.

            커밋: ${{ github.event.head_commit.message }}
          prerelease: true
          files: dist/*
